<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOD Uploader Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="background-elements">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="container">
        <div class="glass-panel">
            <header>
                <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                    <div>
                        <h1>VOD Upload Manager</h1>
                        <p>Transfer your raw video files securely to S3 and initiate your custom transcoding workflow
                            gracefully
                            in the background.</p>
                    </div>
                    <button class="btn-icon" id="toggleViewBtn" title="Toggle Content List"
                        style="padding: 0.5rem; background: rgba(255,255,255,0.1); border-radius: 8px; margin-left: 1rem; cursor: pointer; color: white; display: flex; align-items: center; justify-content: center; transition: all 0.2s; border: 1px solid rgba(255,255,255,0.2);">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                            stroke="currentColor" style="width: 24px; height: 24px;">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M8.25 6.75h12M8.25 12h12m-12 5.25h12M3.75 6.75h.007v.008H3.75V6.75zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zM3.75 12h.007v.008H3.75V12zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm-.375 5.25h.007v.008H3.75v-.008zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z" />
                        </svg>
                    </button>
                </div>
            </header>

            <div class="card" id="uploadView">
                <div class="upload-section" id="uploadDropzone">
                    <div class="icon">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M12 16.5V9.75m0 0l3 3m-3-3l-3 3M6.75 19.5a4.5 4.5 0 01-1.41-8.775 5.25 5.25 0 0110.233-2.33 3 3 0 013.758 3.848A3.752 3.752 0 0118 19.5H6.75z" />
                        </svg>
                    </div>
                    <h2>Drag & Drop up to 15 VODs</h2>
                    <p class="file-limits">MP4, MOV</p>
                    <input type="file" id="fileInput" accept="video/mp4,video/quicktime" multiple hidden>
                    <button class="btn btn-primary" id="selectBtn">Browse Local Files</button>
                </div>

                <div style="margin-bottom: 1rem;">
                    <label for="globalPackagerInput" style="font-weight: 500; font-size: 0.9rem; color: #cbd5e1;">Select Packager Service</label>
                    <select id="globalPackagerInput" class="form-input" style="padding: 0.75rem; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.1); color: white;">
                        <option value="rro-mnc">rro-mnc</option>
                        <option value="rro-dex">rro-dex</option>
                        <option value="vodultra">vodultra</option>
                    </select>
                </div>
                <div id="fileListContainer" class="hidden" style="display: flex; flex-direction: column; gap: 1rem; margin-top: 1rem;">
                    <!-- Dynamic rows will be injected here by script.js -->
                </div>

                <div class="actions">
                    <button class="btn btn-accent gradient-text hidden" id="batchProcessBtn">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                            stroke="currentColor" class="btn-icon-svg">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M5.25 5.653c0-.856.917-1.398 1.667-.986l11.54 6.348a1.125 1.125 0 010 1.971l-11.54 6.347a1.125 1.125 0 01-1.667-.985V5.653z" />
                        </svg>
                        Start Batch Processing
                    </button>
                </div>
            </div>

            <div class="card hidden" id="contentListView">
                <h2 style="margin-top: 0; margin-bottom: 1rem; font-size: 1.5rem; color: white;">Packager Contents</h2>
                <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                    <label for="contentServiceInput" style="font-weight: 500; font-size: 0.9rem; color: #cbd5e1;">Select
                        Service ID</label>
                    <select id="contentServiceInput" class="form-input"
                        style="padding: 0.75rem; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.1); color: white;">
                        <option value="" disabled selected style="color: black;">Choose a service...</option>
                        <option value="rro-mnc" style="color: black;">rro-mnc</option>
                        <option value="rro-dex" style="color: black;">rro-dex</option>
                        <option value="vodultra" style="color: black;">vodultra</option>
                    </select>
                </div>
                <div id="contentListLoading" class="hidden"
                    style="margin-top: 1rem; color: #cbd5e1; font-size: 0.9rem;">
                    Fetching contents...
                </div>
                <div id="contentListWrapper" class="hidden"
                    style="margin-top: 1rem; background: rgba(0,0,0,0.2); border-radius: 8px; max-height: 400px; overflow-y: auto;">
                    <ul id="contentListDisplay" style="list-style: none; padding: 0; margin: 0;">
                        <!-- List items injected dynamically -->
                    </ul>
                </div>
            </div>

            <div id="alertBox" class="alert hidden">
                <span id="alertMessage"></span>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
