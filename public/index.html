<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOD Uploader Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="background-elements">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="container">
        <div class="glass-panel">
            <header>
                <h1>VOD Upload Manager</h1>
                <p>Transfer your raw video files securely to S3 and initiate your custom transcoding workflow gracefully
                    in the background.</p>
            </header>

            <div class="card">
                <div class="upload-section" id="uploadDropzone">
                    <div class="icon">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M12 16.5V9.75m0 0l3 3m-3-3l-3 3M6.75 19.5a4.5 4.5 0 01-1.41-8.775 5.25 5.25 0 0110.233-2.33 3 3 0 013.758 3.848A3.752 3.752 0 0118 19.5H6.75z" />
                        </svg>
                    </div>
                    <h2>Drag & Drop your VOD</h2>
                    <p class="file-limits">MP4, MOV up to unlimited sizes</p>
                    <input type="file" id="fileInput" accept="video/mp4,video/quicktime" hidden>
                    <button class="btn btn-primary" id="selectBtn">Browse Local Files</button>
                    <div id="fileInfo" class="hidden">
                        <span id="fileNameDisplay"></span>
                        <button class="btn-icon" id="clearBtn" title="Remove File">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                                stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="progress-section hidden" id="progressSection">
                    <div class="progress-info">
                        <span id="progressText">Uploading...</span>
                        <span id="progressPercentage">0%</span>
                    </div>
                    <div class="progress-bar-container">
                        <div class="progress-bar" id="progressBar"></div>
                    </div>
                </div>

                <div class="actions">
                    <button class="btn btn-accent gradient-text" id="uploadBtn" disabled>
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                            stroke="currentColor" class="btn-icon-svg">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M12 16.5V9.75m0 0l3 3m-3-3l-3 3M6.75 19.5a4.5 4.5 0 01-1.41-8.775 5.25 5.25 0 0110.233-2.33 3 3 0 013.758 3.848A3.752 3.752 0 0118 19.5H6.75z" />
                        </svg>
                        Upload to S3
                    </button>

                    <div id="transcodeSection" class="hidden"
                        style="width: 100%; display: flex; flex-direction: column; gap: 1rem; margin-top: 1rem;">
                        <input type="text" id="assetIdInput" placeholder="Enter Asset ID (e.g. vod-TT217)"
                            class="form-input"
                            style="padding: 0.75rem; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.1); color: white;">
                        <div style="display: flex; gap: 1rem; text-align: left;">
                            <div style="flex: 1; display: flex; flex-direction: column; gap: 0.5rem;">
                                <label for="serviceInput"
                                    style="font-weight: 500; font-size: 0.9rem; color: #cbd5e1;">t_profile</label>
                                <select id="serviceInput" class="form-input"
                                    style="padding: 0.75rem; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.1); color: white;">
                                    <option value="template_h264_high_2997_vod" style="color: black;">
                                        template_h264_high_2997_vod</option>
                                    <option value="template_h264_medium_2997_vod" style="color: black;">
                                        template_h264_medium_2997_vod</option>
                                    <option value="template_h264_low_2997_vod" style="color: black;">
                                        template_h264_low_2997_vod</option>
                                </select>
                            </div>
                            <div style="flex: 1; display: flex; flex-direction: column; gap: 0.5rem;">
                                <label for="packagerServiceInput"
                                    style="font-weight: 500; font-size: 0.9rem; color: #cbd5e1;">Packager
                                    Service</label>
                                <select id="packagerServiceInput" class="form-input"
                                    style="padding: 0.75rem; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.1); color: white;">
                                    <option value="vodclear" style="color: black;">vodclear</option>
                                    <option value="voddemo" style="color: black;">voddemo</option>
                                    <option value="vodultra" style="color: black;">vodultra</option>
                                </select>
                            </div>
                        </div>
                        <button class="btn btn-success" id="transcodeBtn">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                                stroke="currentColor" class="btn-icon-svg">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M5.25 5.653c0-.856.917-1.398 1.667-.986l11.54 6.348a1.125 1.125 0 010 1.971l-11.54 6.347a1.125 1.125 0 01-1.667-.985V5.653z" />
                            </svg>
                            Start Transcoding
                        </button>
                    </div>
                </div>

                <div id="statusSection" class="hidden"
                    style="margin-top: 1rem; padding: 1rem; background: rgba(0,0,0,0.2); border-radius: 8px;">
                    <h3 style="margin-top: 0; font-size: 1.1rem;">Status: <span id="statusText"
                            style="color: #6ee7b7;">Pending</span></h3>
                    <pre id="packagerResponseDisplay"
                        style="background: rgba(0,0,0,0.5); padding: 1rem; border-radius: 6px; overflow-x: auto; font-size: 0.85rem; margin-bottom: 0; color: #a5b4fc; white-space: pre-wrap; word-wrap: break-word;"></pre>
                </div>
            </div>

            <div id="alertBox" class="alert hidden">
                <span id="alertMessage"></span>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
